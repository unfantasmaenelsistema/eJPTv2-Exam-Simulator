    <circle cx="45" cy="126" r="8" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="65" y="130" fill="#94a3b8" font-size="13" font-family="'Fira Code', monospace">C) portfwd add -l 3389 -p 3389 -r 10.10.10.25</text>

    <rect x="610" y="105" width="570" height="42" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="635" cy="126" r="8" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="655" y="130" fill="#94a3b8" font-size="13" font-family="'Fira Code', monospace">D) iptables -t nat -A PREROUTING -j MASQUERADE</text>

    <rect x="20" y="165" width="1160" height="45" rx="6" fill="#0b1120" />
